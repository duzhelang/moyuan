# ==================== 服务配置 ====================
server:
  port: 8085
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ==================== Spring 配置 ====================
spring:
  application:
    name: moyuan-backend
  profiles:
    active: dev
  config:
    import: optional:classpath:secrets/application-secrets.yml
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/moyuan?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 默认值仅用于本地开发兜底；实际密码请通过环境变量 MYSQL_PASSWORD 覆盖
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      connection-error-retry-attempts: 3
      break-after-acquire-failure: true

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.moyuan: DEBUG
    org.springframework: WARN

# ==================== JWT 配置 ====================
jwt:
  # 默认密钥仅用于本地开发兜底（长度≥32字节，满足HS256要求）；生产环境必须通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:moyuan-dev-secret-key-0123456789-abcdef}
  expiration: 86400000
  # 访问/刷新双 token：access token 有效期（默认 24h），refresh token 有效期（默认 7 天）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ==================== 跨域配置 ====================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ==================== Knife4j 配置 ====================
knife4j:
  enable: true
  setting:
    language: zh_cn

# ==================== 第三方 API 配置 ====================
# 接口盒子（apihz）第三方诗词 API 凭证；默认空值兜底保证启动，调用对应功能前请通过环境变量配置
apihz:
  id: ${APIHZ_ID:}
  key: ${APIHZ_KEY:}

# ==================== 业务配置 ====================
search:
  # 中文搜索增强开关：#7 方案A（MySQL ngram 全文索引）。开启后 smartSearch 对 keyword 走
  # MATCH(...) AGAINST(...) 全文检索（中文 ngram 分词）；关闭则保持原 LIKE 匹配。
  fulltext-enabled: ${SEARCH_FULLTEXT_ENABLED:true}
  pinyin:
    limit: ${SEARCH_PINYIN_LIMIT:200}
external:
  poetry:
    api:
      enabled: true

# ==================== AI 能力开关与调用保护 ====================
ai:
  features:
    # 古籍识文（OCR）维护开关：false 时接口返回明确的维护提示，前端入口同步置灰。
    # 恢复时把本开关与首页 OCR_ENABLED 同时打开，并确保存在 ocr 模块的视觉模型绑定。
    ocr-enabled: ${AI_OCR_ENABLED:false}
  guard:
    # 仅作用于 /api/ai/** 的对外接口；游戏、韵脚、RAG 走内部服务，不受影响。
    enabled: ${AI_GUARD_ENABLED:true}
    # 单用户每分钟最多请求次数
    per-minute: ${AI_GUARD_PER_MINUTE:60}
    # 单用户每日最多请求次数
    daily-requests: ${AI_GUARD_DAILY_REQUESTS:1000}
    # 单用户每日估算 token 上限（按字符数近似估算，仅用于防滥用）
    daily-tokens: ${AI_GUARD_DAILY_TOKENS:1000000}
    # 单次视觉调用（看图写诗/OCR）按固定 token 计费，避免大图绕过配额
    vision-token-cost: ${AI_GUARD_VISION_TOKEN_COST:1000}
